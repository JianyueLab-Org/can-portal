# 教员与管理门户在 jyl-tyo 上的部署。
#
# 形状照着 can-controller 来（它照的是 can-efb，can-efb 照的是 can-dev，can-dev
# 照的是 llm-web）：一个应用一个 namespace，Deployment 和 Service 都叫 app，
# Service 暴露 80，Ingress 走默认的 cloudflare-tunnel —— 这个集群没有别的
# ingress class，控制器会顺手把 DNS 记录建好，所以这里**没有** cert-manager 注
# 解、也**没有** tls: 块，TLS 在 Cloudflare 那一侧终止。
#
# **这个站没有应用级 Secret，一个都不需要。**（下面那枚 `ghcr-pull` 不算：它是
# kubelet 拉私有镜像的凭据，和这个应用运行时读什么无关，Pod 里读不到它。）会话
# 由 can-api 签在**父域**上，成员在主站登录过，cookie 就跟着同源请求到这里，这
# 个站只负责把它转发回 can-api。和 can-efb / can-controller 同一条规矩：如果哪
# 天有人要在这里加 Secret，先确认那件事不能靠转发 cookie 完成。
#
# **这个仓库可以是公开的，而且现在是。** 它一度必须私有：`src/data/sweatbox/` 装
# 着从扇区包和商用 AIRAC 周期派生的 2.8 MB 数据。那份数据搬进 can-db 之后，这里一
# 个字节都不带，于是和 can-dev / can-radar / can-exam / can-controller / can-docs
# 完全对齐 —— 公开仓库、组织 secret、共享部署工作流。
#
# 这不只是整洁：私有仓库在 JianyueLab-Org（Free 计划）拿不到 KUBECONFIG_B64，也就
# **根本部署不了**。can-efb 至今没上线就是卡在这一条上。
#
# **还没上线。** portal.ceruleanavi.net 至今不解析。清单本身不缺，缺的是两件外
# 部事项，和 can-efb 当初一样：把它接进 Cloudflare 隧道，确认 can-api 的会话
# cookie 域覆盖 `.ceruleanavi.net`（它已经覆盖了 controller 和 exam，所以这一条
# 多半是确认而不是改动）。
#
# **不需要**把这个域加进 can-api 的 ALLOWED_ORIGINS —— 浏览器只打本站的同源反
# 代，从不直连 can-api，那正是 src/pages/api/v1/[...path].ts 存在的理由。
---
apiVersion: v1
kind: Namespace
metadata:
  name: can-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: can-portal
spec:
  # 两个副本，和几个兄弟站一致。这个站的用户是教员和管理层，几十个人而不是几千
  # 个，但副本数是为了滚动更新时不断服务，不是为了吞吐。
  replicas: 2
  selector:
    matchLabels:
      app: can-portal
  template:
    metadata:
      labels:
        app: can-portal
    spec:
      # **包的可见性不跟着仓库变。** can-controller 的清单里记着这一点：一个在
      # 仓库还私有时第一次推上去的 GHCR 包会继承「私有」，之后把仓库改公开**不会**
      # 改它，而且只能在网页上手动改（REST API 没有那个端点）。
      #
      # 所以这几行留着，直到有人去网页上把 ghcr.io/jianyuelab-org/can-portal 这个
      # 包改成 public。改完就可以删掉它们 —— 顺序反了会让全站拉不起来（症状是
      # ImagePullBackOff，在 `kubectl get pods` 上只表现为「起不来」）。
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          # 按 sha 钉住，别用 :latest —— 那个标签没有回滚故事：没有更早的标签
          # 可指，而「重启一下」实际上等于「用最后推上去的那个」。CI 两个标签
          # 都推，所以换成 sha 只是改这一行。
          image: ghcr.io/jianyuelab-org/can-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4321
          env:
            # 数据全部来自 can-api。
            - name: CAN_API_ORIGIN
              value: https://api.ceruleanavi.net
            # 登录页，以及侧栏里那一排还留在主站的跨站链接。
            - name: CAN_WEB_ORIGIN
              value: https://ceruleanavi.net
            # SweatBox 参考数据从 can-db 读。**集群内地址** —— can-db 没有
            # Ingress，它服务的是有许可限制的航行资料，只在集群内监听。
            #
            # 它不可达时生成器的机场选择器是空的，页面照常渲染。刻意不让它变成一
            # 个错误页：教员看见「选不出机场」能猜到是数据没来，看见 500 只能猜。
            - name: CAN_DB_ORIGIN
              value: http://app.can-db.svc.cluster.local
            # 写操作的 Origin 比对基准。必须是显式值：反代后面从 Host 推出来的
            # 是 http://，浏览器发的是 https://，永远对不上。这个站的写操作是
            # 晋升、结算积分和发奖品，所以这一条配错的代价比在别处大。
            - name: PUBLIC_ORIGIN
              value: https://portal.ceruleanavi.net
          # 探的是 /healthz，不是 /。`/` 在这个站上会先问一次 can-api 再可能
          # 302，拿它当探活等于每 10 秒给上游加一次白流量，而且会把上游的抖动放
          # 大成自己的 Pod 重启。详见 src/pages/healthz.ts。
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4321
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4321
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              # 回到和兄弟站一样的 128Mi。之前是 192Mi，理由是 SweatBox 的参考
              # 数据经 `import.meta.glob` 打包进产物、按需加载又不释放 —— 那份数
              # 据搬进 can-db 之后这个理由就没了，进程现在只是转发 JSON。
              memory: 128Mi
            limits:
              memory: 512Mi
          # runAsUser 必须是数字：镜像里写的是 USER 1000，但即使写成名字
          # kubelet 也不解析，配上 runAsNonRoot 会直接 CreateContainerConfigError。
          # can-radar 上线时踩过这一脚。
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: can-portal
spec:
  selector:
    app: can-portal
  ports:
    - port: 80
      targetPort: 4321
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: can-portal
  namespace: can-portal
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: portal.ceruleanavi.net
      http:
        paths:
          - backend:
              service:
                name: app
                port:
                  number: 80
            path: /
            pathType: Prefix
