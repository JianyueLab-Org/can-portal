name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 权限要在**调用方**声明：可复用工作流里的 permissions 是它需要什么，不是它能拿
# 到什么。仓库默认的 GITHUB_TOKEN 只有 packages: read / deployments: none，缺了会
# 在启动阶段被拒，而 startup_failure 是拿不到日志的。
permissions:
  contents: read
  packages: write
  deployments: write

# 这个文件曾经把 kubectl 那几步内联着，因为这个仓库当时**必须是私有的** ——
# `src/data/sweatbox/` 装着从扇区包和商用 AIRAC 周期派生的 2.8 MB 数据。而私有仓
# 库在 JianyueLab-Org（Free 计划）拿不到组织 secret，于是也调不了组织里的共享工作
# 流，只能内联。
#
# **那份数据搬进 can-db 了**，这个仓库现在一个字节都不带，所以它可以公开、可以拿到
# 组织 secret、可以和另外五个卫星站用同一个三行的调用。少一份要各自维护的部署脚本。
jobs:
  deploy:
    uses: JianyueLab-Org/actions/.github/workflows/deploy-k8s.yml@main
    with:
      image: ghcr.io/jianyuelab-org/can-portal
      namespace: can-portal
      manifest: deploy/k8s.yaml
      environment_url: https://portal.ceruleanavi.net
    secrets: inherit
